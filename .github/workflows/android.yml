name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ touchbar ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (desktop, needed by androiddeployqt)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'desktop'
          modules: 'qt5compat'

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qt5compat'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 33 (avoid aapt2 bug on newer platforms)
        run: |
          yes | sdkmanager --install "platforms;android-33"

      - name: Remove macOS-only sources from .pro
        run: |
          sed -i '/KDMacTouchBar/d' ScriptEditorQt.pro || true

      - name: Force smaller UI scale (patch main.cpp)
        run: |
          MAIN_FILE=$(grep -rl "QApplication.*argc, *argv" --include=*.cpp . | head -n1)
          echo "Archivo encontrado: $MAIN_FILE"
          if [ -n "$MAIN_FILE" ]; then
            sed -i '0,/QApplication.*argc, *argv/{s/\(.*QApplication.*argc, *argv.*\)/    qputenv("QT_SCALE_FACTOR", "0.7");\n\1/}' "$MAIN_FILE"
          else
            echo "ERROR: no se encontró el archivo con QApplication"
            exit 1
          fi

      - name: Add custom app icon
        run: |
          QT_ANDROID_DIR=$(dirname $(dirname $(which qmake)))
          mkdir -p android
          cp -r "$QT_ANDROID_DIR/src/android/templates/"* android/
          find android/res -iname 'ic_launcher*' -delete
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/res/mipmap-$d"
            cp icon.png "android/res/mipmap-$d/ic_launcher.png"
            cp icon.png "android/res/mipmap-$d/ic_launcher_round.png"
          done
          if grep -q 'android:icon=' android/AndroidManifest.xml; then
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/' android/AndroidManifest.xml
          else
            sed -i '0,/<application /s/<application /<application android:icon="@mipmap\/ic_launcher" /' android/AndroidManifest.xml
          fi
          if grep -q 'android:roundIcon=' android/AndroidManifest.xml; then
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/' android/AndroidManifest.xml
          fi

      - name: qmake
        run: |
          qmake ScriptEditorQt.pro -spec android-clang ANDROID_ABIS="arm64-v8a" ANDROID_PLATFORM=android-33 ANDROID_PACKAGE_SOURCE_DIR=$PWD/android

      - name: Build
        run: make -j$(nproc)

      - name: Install (copy binary into deployment dir)
        run: make INSTALL_ROOT=android-build install

      - name: Deploy APK
        run: |
          androiddeployqt --input android-ScriptEditorQt-deployment-settings.json --output android-build --android-platform android-33 --gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android-build/build/outputs/apk/**/*.apk
