name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ touchbar ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (desktop, needed by androiddeployqt)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'desktop'
          modules: 'qt5compat'

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qt5compat'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 33 (avoid aapt2 bug on newer platforms)
        run: |
          yes | sdkmanager --install "platforms;android-33"

      - name: Remove macOS-only sources from .pro
        run: |
          sed -i '/KDMacTouchBar/d' ScriptEditorQt.pro || true

      - name: Prepare custom AndroidManifest.xml (disable auto DPI scaling)
        run: |
          QT_ANDROID_DIR=$(dirname $(dirname $(which qmake)))
          mkdir -p android
          cp -r "$QT_ANDROID_DIR/src/android/templates/"* android/
          sed -i '/<\/application>/i\    <meta-data android:name="android.app.env_vars" android:value="QT_ENABLE_HIGHDPI_SCALING=0\\tQT_SCALE_FACTOR=0.5"/>' android/AndroidManifest.xml

      - name: qmake
        run: |
          qmake ScriptEditorQt.pro -spec android-clang ANDROID_ABIS="arm64-v8a" ANDROID_PLATFORM=android-33 ANDROID_PACKAGE_SOURCE_DIR=$PWD/android

      - name: Build
        run: make -j$(nproc)

      - name: Install (copy binary into deployment dir)
        run: make INSTALL_ROOT=android-build install

      - name: Deploy APK
        run: |
          androiddeployqt --input android-ScriptEditorQt-deployment-settings.json --output android-build --android-platform android-33 --gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android-build/build/outputs/apk/**/*.apk
