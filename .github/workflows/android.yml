name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ touchbar ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (desktop, needed by androiddeployqt)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'desktop'
          modules: 'qtcore5compat'

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtcore5compat'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Remove macOS-only sources from .pro
        run: |
          sed -i '/KDMacTouchBar/d' ScriptEditorQt.pro || true

      - name: qmake
        run: |
          qmake ScriptEditorQt.pro -spec android-clang ANDROID_ABIS="arm64-v8a"

      - name: Build
        run: make -j$(nproc)

      - name: Deploy APK
        run: |
          androiddeployqt --input android-ScriptEditorQt-deployment-settings.json --output android-build --gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android-build/build/outputs/apk/**/*.apk
